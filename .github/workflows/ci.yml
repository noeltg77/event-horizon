name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke-test the built CLI the way users run it
      - run: node packages/cli/dist/index.js --version
      - run: node packages/cli/dist/index.js doctor --json
      - run: node packages/cli/dist/index.js models
      - run: node packages/cli/dist/index.js plan qwen3.5-4b
      # Make sure the published package stays small (binaries and models download at runtime)
      - name: Package size
        shell: bash
        run: |
          cd packages/cli
          npm pack --dry-run 2>&1 | tail -5
